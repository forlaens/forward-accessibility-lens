version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Copenhagen
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    assignees:
      - 2biazdk
    labels:
      - dependencies
    open-pull-requests-limit: 5
    versioning-strategy: increase

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Europe/Copenhagen
    groups:
      github-actions:
        patterns:
          - "*"
    assignees:
      - 2biazdk
    labels:
      - dependencies
    open-pull-requests-limit: 3
